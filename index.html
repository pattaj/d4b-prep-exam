<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master's Exam Review</title>
    <!-- Link to CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Mobile Navbar -->
<div class="mobile-header">
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    <h2>Master's Exam Review</h2>
    <div style="width: 24px;"></div>
</div>

<!-- Dark Overlay for Mobile Menu -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="app-layout">
    <!-- Left Navigation Menu -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="toggleMenu()">✕</button>
        <h3>📚 Topics Menu</h3>
        <div id="menuContainer"></div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <h1 id="mainTitle">🎓 Master's Exam Review</h1>
        <p style="text-align:center; color:#666;" id="instructionsText">Select a topic from the menu or test yourself below.</p>
        
        <!-- The Quiz Container -->
        <form id="quizForm">
            <div id="quizContainer"></div>
            <button type="button" class="btn" id="submitQuizBtn" onclick="gradeQuiz()">Submit Quiz & View Analytics</button>
            
            <!-- Hidden Review Buttons -->
            <div class="action-buttons" id="reviewActionBtns" style="display:none; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                <button type="button" class="btn btn-outline" onclick="showAnalytics()">📊 Back to Analytics</button>
                <button type="button" class="btn" onclick="retakeQuiz()">🔄 Retake This Section</button>
            </div>
        </form>
        
        <!-- Full Analytics Dashboard -->
        <div id="fullAnalyticsView" class="full-analytics">
            <h2 style="color: #1a73e8; margin-top:0;">Performance Dashboard</h2>
            
            <div class="score-circle" id="overallScoreCircle"></div>
            <div class="score-feedback" id="overallScoreText"></div>

            <div class="analytics-box">
                <div class="analytics-title">📊 Topic Breakdown</div>
                <div id="analyticsContent"></div>
            </div>

            <div class="action-buttons">
                <button type="button" class="btn btn-outline" onclick="reviewAnswers()">👀 Review Answers</button>
                <button type="button" class="btn" onclick="retakeQuiz()">🔄 Retake This Section</button>
            </div>
        </div>
    </div>
</div>

<!-- 1. Load Question Data First -->
<script src="question.js"></script>
<!-- 2. Load App Logic Second -->
<script src="app.js"></script>

</body>
</html>
